name: wheels

on:
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - CMakeLists.txt
      - cmake/**
      - python/**
      - third_party/**
      - scripts/ci/wheel_smoke.py
      - .github/workflows/wheels.yml
  release:
    types: [published]
  push:
    tags: ["v*"]

jobs:
  # Linux (manylinux_2_28) and macOS wheels carry the planning stack, built from the pins in
  # third_party/. musllinux and Windows wheels carry the geometry core (pyproject.toml).
  build_wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae  # v4.2.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Check the wheels for content that must not ship
        shell: bash
        run: python scripts/ci/check_distribution.py wheelhouse/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Build a wheel from the sdist to check that it builds the whole stack from source.
  build_sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Build the sdist
        run: pipx run build==1.3.0 --sdist

      - name: Check its size and content
        run: |
          python - <<'PY'
          import glob, os, sys
          sdist = glob.glob("dist/*.tar.gz")[0]
          size = os.path.getsize(sdist)
          print(f"{sdist}: {size / 1e6:.1f} MB")
          sys.exit(size > 90e6)
          PY
          python scripts/ci/check_distribution.py dist/*.tar.gz

      - name: Build and test a wheel from the sdist
        run: pipx run cibuildwheel==4.2.1 dist/*.tar.gz --only cp312-manylinux_x86_64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
