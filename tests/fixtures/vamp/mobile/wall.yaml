# A wall between the start and goal bases of the whole-body planning tests. Box
# dimensions are full extents.
world:
  collision_objects:
    - id: wall
      primitive_poses:
        - position: [0.0, 0.0, 0.6]
          orientation: [0.0, 0.0, 0.0, 1.0]
      primitives:
        - type: box
          dimensions: [0.3, 1.6, 1.2]
