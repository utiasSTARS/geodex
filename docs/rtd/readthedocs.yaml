# Read the Docs serves the pre-built HTML site from the docs-html branch.
#
# The Python API reference is generated by autodoc, which imports the compiled
# geodex module, so the docs must be built where the full planning stack is
# importable. That happens in the pixi `docs` task (locally or in CI), and
# scripts/ci/publish_docs.sh pushes the rendered site to the docs-html branch with
# this file at its root. Read the Docs then copies the pre-built html/ into its
# output and serves it, compiling nothing itself.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - mkdir -p "$READTHEDOCS_OUTPUT/html"
    - cp -r html/. "$READTHEDOCS_OUTPUT/html/"
