# Files of the two ROS 2 plugin repositories that the ROS 2 pages show or read.
#
# docs/tools/plugin_sources.py copies each file verbatim into docs/ros2/sources/<repository>/
# with the same relative path, records its SHA-256 here, and writes the parameter and robot
# tables under docs/ros2/generated/ from the copies. Its check mode fails when a copy differs
# from its recorded hash, when a table differs from what the copies produce, or, with the
# plugin checkouts present, when a copy differs from the plugin's own file. The copies are
# the plugins' tested configuration files, so every snippet on the pages is one of them.
#
# The checkouts default to sibling directories of the geodex tree. GEODEX_NAV2_PLANNER_DIR
# and GEODEX_MOVEIT_DIR name others.

[repositories.geodex_nav2_planner]
url = "https://github.com/utiasSTARS/geodex_nav2_planner"
env = "GEODEX_NAV2_PLANNER_DIR"
files = [
  "README.md",
  "params/geodex_nav2_planner_parameters.yaml",
  "config/office.yaml",
  "config/robots/jackal.yaml",
  "config/robots/husky.yaml",
  "config/robots/ridgeback.yaml",
  "config/robots/dingo_o.yaml",
]

[repositories.geodex_moveit]
url = "https://github.com/utiasSTARS/geodex_moveit"
env = "GEODEX_MOVEIT_DIR"
files = [
  "README.md",
  "geodex_moveit/params/geodex_moveit_parameters.yaml",
  "geodex_moveit_demos/config/fr3_shelf_geodex.yaml",
]

# SHA-256 of every copy, written by the sync mode.
