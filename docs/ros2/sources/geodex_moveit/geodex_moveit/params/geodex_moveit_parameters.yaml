# This file declares every geodex_moveit parameter and its default. Configuration files only
# override these values.
geodex_moveit:
  robot:
    type: string
    default_value: ""
    description: "Name of the geodex robot model that sets the mass matrix, the heuristic and the collision model, or empty to plan in a Euclidean space of the group's dimension with the moveit checker."
  metric:
    type: string
    default_value: "euclidean"
    description: "Riemannian metric on the configuration space, where kinetic_energy requires a robot model."
    validation:
      one_of<>: [["euclidean", "kinetic_energy"]]
  checker:
    type: string
    default_value: "vamp"
    description: "Collision checker, either vamp for geodex's sphere model of the robot, which requires a robot model, or moveit for the planning scene."
    validation:
      one_of<>: [["vamp", "moveit"]]
  base_link:
    type: string
    default_value: ""
    description: "Root link of the vamp collision model, or empty for the model frame."
  end_effector_link:
    type: string
    default_value: ""
    description: "MoveIt link in which the vamp checker expresses attached-object spheres, or empty for the collision model's own end-effector frame."
  end_effector_offset:
    type: double_array
    default_value: []
    description: "Pose of the collision model's end-effector frame in end_effector_link as x, y, z, roll, pitch, yaw, required when end_effector_link is another link, for example [0, 0, 0.105, 0, 0, 0] for the Panda's panda_grasptarget in panda_hand."
    validation:
      size_lt<>: [7]
  attachment_padding:
    type: double
    default_value: 0.0
    description: "Meters added to every attached-object sphere radius during planning."
    validation:
      gt_eq<>: [0.0]
  obstacle_padding:
    type: double
    default_value: 0.0000043
    description: "Clearance in meters that planned configurations keep from every obstacle of the planning scene."
    validation:
      gt_eq<>: [0.0]
  exact_attached_box:
    type: bool
    default_value: true
    description: "Also check an attached box exactly against the world's boxes, when an attached box primitive or attached_object.box_size gives one."
  exact_attached_box_margin:
    type: double
    default_value: 0.001
    description: "Meters added to each half extent of the attached box in the exact test."
    validation:
      gt_eq<>: [0.0]
  attached_object:
    link:
      type: string
      default_value: ""
      description: "Link in whose frame box_size, box_pose and spheres are given, or empty for the link the body is attached to."
    box_size:
      type: double_array
      default_value: []
      description: "Attached box size along x, y and z in meters, or empty to take the largest box primitive of the attached bodies."
      validation:
        size_lt<>: [4]
    box_pose:
      type: double_array
      default_value: []
      description: "Attached box center as x, y, z, roll, pitch, yaw in the frame of attached_object.link, or empty for the link origin."
      validation:
        size_lt<>: [7]
    spheres:
      type: double_array
      default_value: []
      description: "Spheres of the attached object for the vamp checker as x, y, z and radius per sphere in the frame of attached_object.link, for example generated by foam. Empty takes the sphere primitives of each attached body, or one sphere that encloses a body without them."
  ignore_unsupported_shapes:
    type: bool
    default_value: false
    description: "Leave out scene shapes that the vamp checker cannot represent, such as planes and octrees, instead of failing the request."
  planner:
    config:
      grrtstar:
        range:
          type: double
          default_value: 1.2
          description: "Maximum extension length in metric units."
          validation:
            gt<>: [0.0]
        greedy_biasing_ratio:
          type: double
          default_value: 0.9
          description: "Probability per sample that the informed sampler narrows its cost bound to the greedy cost."
          validation:
            bounds<>: [0.0, 1.0]
        planner_greedy_biasing_ratio:
          type: double
          default_value: 0.0
          description: "G-RRT* planner-side greedy biasing ratio that chooses the cost bound passed to the sampler, where 0 leaves the narrowing to greedy_biasing_ratio."
          validation:
            bounds<>: [0.0, 1.0]
        rewire_factor:
          type: double
          default_value: 1.1
          description: "Scale on OMPL's k-nearest rewiring constant."
          validation:
            gt<>: [0.0]
        max_neighbors:
          type: int
          default_value: 0
          description: "Maximum size of the k-nearest rewiring neighborhood, or 0 to leave it uncapped."
          validation:
            gt_eq<>: [0]
        greedy_cost_for_tree_pruning:
          type: bool
          default_value: true
          description: "Prune the trees with the greedy cost rather than the current solution cost when greedy_biasing_ratio or planner_greedy_biasing_ratio is positive."
    termination:
      type: string
      default_value: "anytime"
      description: "Termination condition, where first stops at the first solution and anytime optimizes until the allowed planning time minus the share that smoothing.time_fraction reserves for smoothing."
      validation:
        one_of<>: [["first", "anytime"]]
    collision_check_resolution:
      type: double
      default_value: 0.01
      description: "Maximum joint-space distance between collision checks along an edge, in the norm of the group's coordinates for every metric. The returned path is checked at this spacing. With a geodex collision model, the smoother spaces its checks by the sphere motion of this distance at the robot's largest sphere speed."
      validation:
        gt<>: [0.0]
    edge_motion_validator:
      type: bool
      default_value: true
      description: "Check the search's edges with the model's VAMP edge check for a robot with a geodex collision model, and with the request's validity checker at collision_check_resolution otherwise. When false, OMPL's discrete motion validator checks the edges at the same resolution."
    ik_timeout:
      type: double
      default_value: 0.1
      description: "Longest time in seconds spent sampling joint goals for pose and position goals. The valid solution nearest the start becomes the goal."
      validation:
        gt<>: [0.0]
    max_iterations:
      type: int
      default_value: 0
      description: "Search iteration budget in addition to the time budget, or 0 for the time budget alone."
      validation:
        gt_eq<>: [0]
    seed:
      type: int
      default_value: -1
      description: "Seed of OMPL's random number generator and geodex's samplers for the search, or -1 to seed from the system."
      validation:
        gt_eq<>: [-1]
  smoothing:
    enabled:
      type: bool
      default_value: true
      description: "Smooth the solution with geodex's metric-aware smoother. It returns the first of its stages, from the smoothed path back to the planner's path, that passes the planner's validity checker, the joint bounds and the smoother's edge checks."
    output_spacing:
      type: double
      default_value: 0.01
      description: "Longest joint-space step between the smoother's returned waypoints, or 0 for no limit. The waypoints lie at equal steps between the corners the smoother keeps."
      validation:
        gt_eq<>: [0.0]
    round_corners:
      type: bool
      default_value: true
      description: "Round the corners of the smoothed path into metric-aware, twice continuously differentiable curves, checked like every other edge."
    seed:
      type: int
      default_value: 42
      description: "Seed of the smoother's random shortcuts."
      validation:
        gt_eq<>: [0]
    time_fraction:
      type: double
      default_value: 0.2
      description: "Share of allowed_planning_time that an anytime search leaves to smoothing."
      validation:
        bounds<>: [0.0, 0.9]
