# Clearpath Dingo-O (do100), a holonomic base on mecanum wheels.
#
# The footprint comes from clearpath_common tag 2.9.17 (726d7fba), package
# clearpath_platform_description, and from the dimensions Clearpath publishes for the platform.
# The footprint is the rectangle around base_link that covers the description's collision
# geometry (chassis and wheels), widened to the published outer dimensions where those are
# larger. It covers the whole robot.
#   description  chassis collision mesh x +-0.3432 m, y +-0.2586 m
#                (meshes/do100/omni_chassis_collision.stl), wheels r 0.050 m at wheelbase
#                0.570 m and track 0.3708 m, inside the chassis outline
#   published    686 x 517 mm (clearpathrobotics.com/dingo-indoor-mobile-robot)
#
# As on the Ridgeback, wy equals wx and the direction stage is off.
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "geodex_nav2_planner::GeodexSE2Planner"
      wx: 1.0
      wy: 1.0
      wtheta: 2.0
      max_reverse_run: -1.0
      forward_repair: false

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.3432, 0.2586], [0.3432, -0.2586], [-0.3432, -0.2586], [-0.3432, 0.2586]]"
