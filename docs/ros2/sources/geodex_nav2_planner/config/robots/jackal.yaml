# Clearpath Jackal (j100), a skid-steer base driven as a differential drive.
#
# The footprint comes from clearpath_common tag 2.9.17 (726d7fba), package
# clearpath_platform_description, and from the dimensions Clearpath publishes for the platform.
# The footprint is the rectangle around base_link that covers the description's collision
# geometry (chassis and wheels), widened to the published outer dimensions where those are
# larger. It covers the whole robot.
#   description  chassis box 0.420 x 0.310 m (urdf/j100/j100.urdf.xacro, chassis_length and
#                chassis_width), wheels r 0.098 m, width 0.040 m at wheelbase 0.262 m and
#                track 0.37559 m, together x +-0.229 m, y +-0.208 m
#   published    508 x 430 mm (clearpathrobotics.com/jackal-small-unmanned-ground-vehicle)
#
# The weights are the defaults. With wy 50, a meter of sideways motion costs as much as sqrt(50),
# about 7 m, of forward driving. The robot turns and drives forward instead of moving sideways.
# The direction stage turns backward stretches into forward driving outside 1 m of the start
# and goal. Merge both blocks into a Nav2 parameter file.
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "geodex_nav2_planner::GeodexSE2Planner"
      wx: 1.0
      wy: 50.0
      wtheta: 2.0
      max_reverse_run: 0.2
      forward_repair: true

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.254, 0.215], [0.254, -0.215], [-0.254, -0.215], [-0.254, 0.215]]"
