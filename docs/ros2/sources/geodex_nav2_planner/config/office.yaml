# Parameters of the office demo, on top of nav2_params.yaml and a robot file. The planner adds
# tree edges of at most range under the metric. With a seed and an iteration budget, the same
# request returns the same path.
planner_server:
  ros__parameters:
    GridBased:
      seed: 1
      refine_iterations: 1000
      range: 10.5
      solve_time: 60.0
      refine_time: 60.0
      publish_footprints: true
      marker_spacing: 0.8
      marker_z: 0.02
